# intelligentbase CI —— 忠实落地 docs/cicd_pipeline.md 的 10 阶段定义
#
# 平台实现选择：GitHub Actions（原定义文档 §附注「待 PM 确认平台」，此处选定）。
# 触发：push main 全量 / PR 全量 / workflow_dispatch 手动（供 PHASE_11 部署前复跑）。
# 纪律：任一阶段失败即 abort（原生 fail-fast，后续 step 自动跳过），不 continue-on-error。
#
# REV-13 增量（INV-GROUP_E-INTELBASE-004）：
#   * 阶段2 追加「Schema/迁移检查」（003_accounts.sql 语法 + 幂等 + 与代码生成器单源一致）。
#   * 测试基线修正：unit 95 / integration 123 / e2e 21 / full 239（0 skip/xfail）；前端冒烟 13。
#   * bcrypt（>=4,<5）已随 requirements-offline.txt 安装（R13 账户体系离线自测需要真 bcrypt）。
#
# REV-14 增量（INV-GROUP_E-INTELBASE-005）：R13 回归缺陷修复（全局管理员「当前项目」选择 +
#   X-IB-Project 传播）。无迁移 / 无新依赖 / 无新 env 键、package.json 与 lock 零改动 —— 故
#   **不新增、不删除、不修改任何 step**，仅同步下方注释基线标签：
#   * 测试基线：unit 95 / integration 129 / e2e 21 / full 245（0 skip/xfail）；前端冒烟 21。
#   * R14 新用例随既有 step 自动纳入：集成层 test_project_context_int_r14.py（TC-INT-123~128）、
#     前端层 frontend.smoke.test.js（TC-FE-018~021）；selfcheck.py 47/47（含 2 条 R14 用例）。
#   * 硬门集合不变（禁 Docker / 禁 PyMuPDF / langchain-openai<0.3 / langchain-core 区间 / Python 范围）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: build & test (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # 离线装配的环境前提（与 tests/conftest.py、scripts/selfcheck.py 保持一致；
    # 两者内部也会 setdefault 这些键，此处再显式声明一次作为 job 级兜底）。
    env:
      PYTHONUTF8: "1"
      IB_OFFLINE_MODE: "1"
      IB_CONFIG_SOURCE: dict
      IB_OFFLINE_TOKEN: ci-offline-token
      IB_LOG_LEVEL: ERROR
      DJANGO_SETTINGS_MODULE: ibweb.settings

    steps:
      # ---- 阶段 1：Source（git checkout / fetch）----
      - name: Checkout (阶段1 Source)
        uses: actions/checkout@v4

      # ---- 依赖安装（测试与自检前置；不属于 10 阶段，是 runner 准备）----
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements-offline.txt

      # 离线纪律：只装 requirements-offline.txt（不含 qdrant-client / rapidocr /
      # onnxruntime / pypdfium2 / langchain-openai），另补测试工具 pytest + pytest-cov。
      # R13：requirements-offline.txt 含 bcrypt>=4,<5（账户体系离线自测须真 bcrypt；
      # 纯计算库，不触网、不连任何外部服务 —— 不降低离线隔离性）。
      - name: Install offline deps + test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements-offline.txt pytest pytest-cov

      # ---- 阶段 2：Config + Schema Check（compileall + 迁移/模式检查）----
      - name: Compile check (阶段2 Config)
        run: python -m compileall -q src

      # R13（阶段2）：Schema/迁移门 —— 003_accounts.sql 语法合法 + 幂等可重放 +
      # 与代码生成器（ib/ledger/schema.py::account_ddl_script()）单源一致。
      # 对齐 checklists B20；只用标准库（runner 无需 sqlite3 CLI）。
      - name: Schema / migration check (阶段2 R13)
        run: |
          python - <<'PY'
          import sqlite3, pathlib, sys
          sql = pathlib.Path("src/deploy/migrations/003_accounts.sql").read_text(encoding="utf-8")
          con = sqlite3.connect(":memory:")
          con.executescript(sql)   # first apply
          con.executescript(sql)   # idempotent replay (no side effects => pass)
          names = {r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {"users", "sessions"} <= names, names
          sys.path.insert(0, "src")
          from ib.ledger.schema import account_ddl_script  # noqa: E402
          norm = lambda s: "".join(s.split())   # collapse whitespace (snapshot reflowed indentation)
          assert norm(account_ddl_script()) in norm(sql), "003 snapshot != schema generator"
          print("PASS: 003_accounts.sql syntax-ok / idempotent / single-source")
          PY

      # ---- 阶段 3：Unit（基线 95/95，R13）----
      - name: Unit tests (阶段3)
        run: python -m pytest tests/unit -q

      # ---- 阶段 4：Integration（基线 129/129，R14；R13 为 123）----
      - name: Integration tests (阶段4)
        run: python -m pytest tests/integration -q

      # ---- 阶段 5：E2E（基线 21/21，R13/R14 未变；含端到端问答 smoke TC-E2E-001）----
      - name: E2E tests (阶段5)
        run: python -m pytest tests/e2e -q

      # ---- 阶段 6：Full suite + coverage（基线 245/245，R14；0 skip/xfail；覆盖率仅记录不设门）----
      - name: Full suite + coverage (阶段6)
        run: python -m pytest tests --cov=ib --cov=ibweb --cov=ib_embed -q

      # ---- 阶段 7：Offline selfcheck（任一 FAIL 非零退出）----
      - name: Offline selfcheck (阶段7)
        run: python src/scripts/selfcheck.py

      # ---- 阶段 8：Version gate（硬断言）----
      - name: Version gate (阶段8)
        run: |
          set -euo pipefail
          echo "== bcrypt >=4,<5（R13 / DR-11）=="
          python -c "import importlib.metadata as m; v=m.version('bcrypt'); major=int(v.split('.')[0]); assert 4 <= major < 5, f'bcrypt {v} not in >=4,<5'; print('PASS: bcrypt', v)"

          echo "== langchain-core >=0.3,<2.0 =="
          # langchain-core 随 requirements-offline.txt 安装，直接断言实际装到的版本区间。
          python -c "import importlib.metadata as m; v=m.version('langchain-core'); ma,mi=v.split('.')[:2]; assert (int(ma),int(mi)) >= (0,3) and int(ma) < 2, f'langchain-core {v} not in >=0.3,<2.0'; print('PASS: langchain-core', v)"

          echo "== langchain-openai < 0.3 =="
          # 离线依赖集刻意不含 langchain-openai，故改为校验 requirements.txt 的声明 pin
          # （0.3.x 删除 _convert_chunk_to_generation_chunk 致流式断流，必须 <0.3）。
          grep -qE '^langchain-openai[[:space:]]*>=[^#]*<0\.3' src/requirements.txt \
            && echo "PASS: langchain-openai pin <0.3" \
            || { echo "FAIL: langchain-openai 未 pin <0.3"; exit 1; }

          echo "== 禁 PyMuPDF / fitz =="
          out=$(python -c "import importlib.util as u; print(u.find_spec('fitz'), u.find_spec('pymupdf'))")
          echo "fitz/pymupdf spec: ${out}"
          [ "${out}" = "None None" ] \
            && echo "PASS: 无 PyMuPDF/fitz" \
            || { echo "FAIL: PyMuPDF/fitz 在场（AGPL-3.0 合规硬约束）"; exit 1; }

          echo "== 禁 Docker（DR-03）=="
          # `command -v docker` 属部署目标机硬门（D-gate），GitHub 托管 runner 自带 docker CLI，
          # 不能作 CI 判据（否则永远假阳性）。CI 只校验「仓库不含 Dockerfile/compose」——
          # 即交付物不是容器镜像（DR-03 的可 CI 化部分）。
          if find . -type f \( -name 'Dockerfile' -o -name 'docker-compose.yml' -o -name 'docker-compose.yaml' \) \
                -not -path './.git/*' | grep -q .; then
            echo "FAIL: 仓库存在 Dockerfile / docker-compose"; exit 1
          else
            echo "PASS: 无 Dockerfile / compose"
          fi

          echo "== Python 版本（>=3.11,<3.14）=="
          python -V
          python -c "import sys; assert (3,11) <= sys.version_info[:2] < (3,14), 'python out of range'; print('PASS')"

      # ---- 阶段 9：Frontend build（vue-tsc 零错 + vite build + 前端冒烟测试）----
      # 已提交 package-lock.json，用 npm ci 精确复现（版本锁定，杜绝 ^ 区间漂移）。
      # R10：阶段9 现含前端单测 `npm test`（Node 20 内置 node:test，零新增依赖；
      #      含「package-lock.json 与 package.json 同步」回归闸，守住 R10 的 EUSAGE 根因）。
      # 顺序为先 build 后 test —— 冒烟用例 6 断言 dist/ 产物，须待 vite build 产出后再运行。
      # R13：前端冒烟扩至 13 例（TC-FE-001~013；新增登录/会话/控制台外壳/零旁路 7 例）。
      # R14：前端冒烟扩至 21 例（TC-FE-014~021；项目上下文单点注入 / SSE 覆盖 / ops 不可切换 /
      #      注入 fail-closed —— 行为层真跑）。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Frontend build (阶段9)
        working-directory: src/frontend
        run: |
          npm ci
          npm run build
          npm test

      # ---- 阶段 10：Package artifact（dist + HEAD 可追溯）----
      - name: Record HEAD (阶段10)
        run: |
          git rev-parse HEAD > HEAD
          echo "HEAD=$(cat HEAD)"

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: ib-${{ github.sha }}-${{ github.run_id }}
          path: |
            src/frontend/dist/
            HEAD
          retention-days: 30
